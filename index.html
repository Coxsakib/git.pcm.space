নিশ্চয়ই—একদম copy করার মতো করে দিলাম:

```
<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
</head>
<body>

    <h1 id="title">Hello Hacker 😎</h1>

    <button onclick="changeColor()">Click Me</button>

    <script>
        function changeColor() {
            document.getElementById("title").style.color = "red";
        }
    </script>

</body>
</html>
